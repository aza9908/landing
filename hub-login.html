<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIRL · 1С Hub — вход</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Victor+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{background:#e8e8f2;color:#16161a;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{padding:16px clamp(16px,3vw,38px)}
.bar{background:#16161a;border-radius:32px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;max-width:1204px;margin:0 auto}
.bar img{height:34px;display:block}
.bar a.back{color:#fff;border:1px solid #ffffff55;border-radius:24px;padding:9px 16px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.bar a.back:hover{background:#ffffff14}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 72px}
.card{width:100%;max-width:420px}
h1{font-size:clamp(40px,9vw,56px);font-weight:600;letter-spacing:-.045em;line-height:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1 img{width:.95em;height:.95em}
.sub{font-family:'Victor Mono',ui-monospace,monospace;color:#79798e;font-size:15px;line-height:1.45;margin:18px 0 32px}
label{display:block;font-family:'Victor Mono',ui-monospace,monospace;font-size:13px;color:#79798e;margin:0 0 8px 18px}
input{width:100%;height:52px;border-radius:26px;border:1px solid #d9dbe8;background:#fff;padding:0 20px;font:500 16px 'Inter Tight',system-ui,sans-serif;color:#16161a;margin-bottom:18px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#8f7bf0;box-shadow:0 0 0 4px #8f7bf033}
button{width:100%;height:52px;border:0;border-radius:26px;background:#16161a;color:#fff;font:500 17px 'Inter Tight',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:background .2s,transform .2s}
button:hover{background:#2a2a32;transform:translateY(-1px)}
button:focus-visible,a:focus-visible{outline:2px solid #8f7bf0;outline-offset:3px}
button svg{width:18px;height:18px}
.err{background:#fff;border:1px solid #e9b8c9;color:#a3274f;border-radius:18px;padding:12px 18px;font-size:14px;margin-bottom:22px}
.note{font-family:'Victor Mono',ui-monospace,monospace;color:#8a8a96;font-size:12px;margin-top:22px;text-align:center}
@media (prefers-reduced-motion:reduce){button,input{transition:none}}
</style>
</head>
<body>
<header><div class="bar"><a href="/" aria-label="AI Research Labs"><img src="/logo-airl-white.png" alt="AI Research Labs"></a><a class="back" href="/">На сайт</a></div></header>
<main>
  <form class="card" method="post" action="/airl-1c-hub/login" autocomplete="on">
    <h1>1С<img src="/star-mark.svg" alt="">Hub</h1>
    <p class="sub">Внутренний финансовый хаб AIRL. Доступ только для руководства.</p>
    <!--ERROR-->
    <label for="u">Логин</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Пароль</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></button>
    <p class="note">Данные 1С · только для внутреннего использования</p>
  </form>
</main>
</body>
</html>
