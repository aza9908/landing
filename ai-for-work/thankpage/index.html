    <style>
      body { margin: 0; background: var(--dark); }
      .thank { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .thank__card { width: 100%; max-width: 440px; box-sizing: border-box; padding: 32px 24px; background: var(--bg); border-radius: var(--radius); }
      .thank__card .link-btn { display: inline-block; margin-top: 16px; text-decoration: none; }
    </style>

    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';

  <body>
    <main class="thank">
      <div class="thank__card lead-done">
        <div class="lead-done__icon" aria-hidden="true">✓</div>
        <h1 id="thank-title">Спасибо! Заявка принята</h1>
        <p id="thank-text">Менеджер свяжется с вами в WhatsApp.</p>
        <a class="btn btn--lg btn--block" id="thank-wa" href="https://wa.me/77072314955">Написать в WhatsApp</a>
        <a class="link-btn" href="/ai-for-work/workshop/">Вернуться на страницу</a>
      </div>
    </main>
    <script>
    // Форма кладёт сюда ссылку на WhatsApp с данными заявки: в адрес страницы их не выносим,
    // чтобы имя и телефон не уходили в пиксель. Нет ссылки — зашли не из формы: без Lead и перехода.
    (function () {
      var link = null;
      try {
        link = sessionStorage.getItem('airl_wa_link');
        sessionStorage.removeItem('airl_wa_link');
      } catch (e) {}
      if (!link) return;
      document.getElementById('thank-wa').href = link;
      document.getElementById('thank-text').textContent =
        'Сейчас откроется WhatsApp — отправьте сообщение менеджеру, и он ответит вам.';
      if (window.fbq) fbq('track', 'Lead');
      setTimeout(function () { window.location.href = link; }, 1500);
    })();
    </script>
  </body>
