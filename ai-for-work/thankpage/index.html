<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спасибо! Заявка принята — AI Research Labs</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16161a" />
    <link rel="icon" type="image/png" href="/ai-for-work/workshop/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Victor+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/ai-for-work/workshop/workshop.css?v=3" />
    <style>
      body { background: radial-gradient(60% 60% at 70% 30%, #3a3550 0%, #16161a 60%, #0d0d11 100%); }
      .thank { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .thank .hero__art { right: -12%; top: 50%; width: min(70vw, 760px); margin-top: calc(min(70vw, 760px) / -2); opacity: .8; }
      @media (width <= 767px) { .thank .hero__art { right: -45%; width: 120vw; margin-top: -60vw; top: 22%; opacity: .5; } }
      .thank__card { width: 100%; max-width: 460px; padding: 40px 28px 28px; background: #fff; border-radius: 28px; box-shadow: 0 40px 80px -30px #000; }
      .thank__card h1 { font-size: 32px; font-weight: 500; letter-spacing: -.03em; line-height: 1.05; }
      .thank__card p { color: var(--muted); font-family: var(--mono); font-size: 14px; line-height: 1.55; margin-bottom: 8px; }
      .thank__card .link-btn { display: inline-block; margin-top: 4px; }
    </style>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1677800013871546');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1677800013871546&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <main class="thank">
      <div class="hero__grid" aria-hidden="true"></div>
      <img class="hero__art" src="/crystal.webp" alt="" width="1000" height="1000" />
      <div class="thank__card lead-done">
        <div class="lead-done__icon" aria-hidden="true">✓</div>
        <h1 id="thank-title">Спасибо! Заявка принята</h1>
        <p id="thank-text">Менеджер свяжется с вами в WhatsApp.</p>
        <a class="btn btn--lg btn--block" id="thank-wa" href="https://chat.whatsapp.com/Ce7Q6JbBHppGIORybNS39P">Вступить в сообщество WhatsApp <span class="btn__arrow" aria-hidden="true">↗</span></a>
        <a class="link-btn" href="/ai-for-work/workshop/">Вернуться на страницу</a>
      </div>
    </main>
    <script>
    // Форма кладёт сюда ссылку на WhatsApp: по ней понимаем, что человек пришёл из формы.
    // Нет ссылки — зашли не из формы: без Lead и перехода. Ведём в сообщество, а не в личный чат.
    (function () {
      var community = 'https://chat.whatsapp.com/Ce7Q6JbBHppGIORybNS39P';
      var fromForm = null;
      try {
        fromForm = sessionStorage.getItem('airl_wa_link');
        sessionStorage.removeItem('airl_wa_link');
      } catch (e) {}
      if (!fromForm) return;
      var button = document.getElementById('thank-wa');
      // При автопереходе кнопка не нужна; покажем её, только если WhatsApp не открылся
      button.style.display = 'none';
      setTimeout(function () { button.style.display = ''; }, 5000);
      document.getElementById('thank-text').textContent =
        'Сейчас откроется сообщество AIRL в WhatsApp — вступите, чтобы не пропустить новости воркшопа.';
      if (window.fbq) fbq('track', 'Lead');
      setTimeout(function () { window.location.href = community; }, 1500);
    })();
    </script>
  </body>
</html>
