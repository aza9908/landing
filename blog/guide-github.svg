<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Inter Tight',system-ui,sans-serif">
  <rect width="900" height="320" fill="#0d0d16"/>
  <!-- Gmail card -->
  <g>
    <rect x="40" y="70" width="220" height="180" rx="14" fill="#16161f" stroke="#2a2a3e"/>
    <g transform="translate(150,120)">
      <rect x="-34" y="-22" width="68" height="48" rx="6" fill="#fff"/>
      <path d="M-34 -18 L0 8 L34 -18" fill="none" stroke="#ea4335" stroke-width="5"/>
      <path d="M-34 -20 v40 h10 v-30 l24 18 l24 -18 v30 h10 v-40 h-8 l-26 20 l-26 -20 z" fill="#c5221f" opacity="0.15"/>
    </g>
    <text x="150" y="180" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Google / Gmail</text>
    <text x="150" y="205" text-anchor="middle" fill="#79798e" font-family="'Victor Mono',monospace" font-size="12">почта, которая у вас</text>
    <text x="150" y="223" text-anchor="middle" fill="#79798e" font-family="'Victor Mono',monospace" font-size="12">уже есть</text>
  </g>

  <!-- arrow -->
  <g stroke="#6c5ce0" stroke-width="3" fill="none">
    <line x1="285" y1="160" x2="355" y2="160"/>
    <path d="M348 152 L360 160 L348 168"/>
  </g>

  <!-- GitHub signup card -->
  <g>
    <rect x="380" y="50" width="480" height="220" rx="14" fill="#16161f" stroke="#2a2a3e"/>
    <g transform="translate(420,92)" fill="#fff">
      <path d="M0 -16 a16 16 0 0 0 -5 31 c.8 .1 1.1 -.3 1.1 -.7 v-2.7 c-4.4 1 -5.4 -2.1 -5.4 -2.1 c-.7 -1.8 -1.7 -2.3 -1.7 -2.3 c-1.5 -1 .1 -1 .1 -1 c1.6 .1 2.4 1.7 2.4 1.7 c1.4 2.4 3.7 1.7 4.6 1.3 c.1 -1 .6 -1.7 1 -2.1 c-3.5 -.4 -7.2 -1.8 -7.2 -7.8 c0 -1.7 .6 -3.1 1.6 -4.2 c-.2 -.4 -.7 -2 .2 -4.2 c0 0 1.3 -.4 4.3 1.6 a15 15 0 0 1 7.8 0 c3 -2 4.3 -1.6 4.3 -1.6 c.9 2.2 .3 3.8 .2 4.2 c1 1.1 1.6 2.5 1.6 4.2 c0 6 -3.7 7.4 -7.2 7.7 c.6 .5 1.1 1.5 1.1 3 v4.4 c0 .4 .3 .9 1.1 .7 A16 16 0 0 0 0 -16 Z"/>
    </g>
    <text x="452" y="98" fill="#fff" font-size="18" font-weight="600">github.com/signup</text>

    <!-- form rows -->
    <rect x="420" y="125" width="400" height="34" rx="7" fill="#0d0d16" stroke="#33334a"/>
    <text x="434" y="147" fill="#8a8a9e" font-family="'Victor Mono',monospace" font-size="13">ваш-gmail@gmail.com</text>

    <rect x="420" y="169" width="400" height="34" rx="7" fill="#0d0d16" stroke="#33334a"/>
    <text x="434" y="191" fill="#8a8a9e" font-family="'Victor Mono',monospace" font-size="13">username · например azamat-dev</text>

    <rect x="420" y="216" width="400" height="38" rx="8" fill="#238636"/>
    <text x="620" y="240" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Создать аккаунт</text>
  </g>
